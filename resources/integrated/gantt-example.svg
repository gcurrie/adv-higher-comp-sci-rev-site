<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Gantt chart for the PB Tracker development">
  <rect width="780" height="300" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#002D1C">PB Tracker — development schedule (days)</text>

  <!-- day numbers -->
  <g font-size="12" fill="#1F2937" text-anchor="middle">
    <text x="237.5" y="50">1</text><text x="292.5" y="50">2</text><text x="347.5" y="50">3</text>
    <text x="402.5" y="50">4</text><text x="457.5" y="50">5</text><text x="512.5" y="50">6</text>
    <text x="567.5" y="50">7</text><text x="622.5" y="50">8</text><text x="677.5" y="50">9</text>
    <text x="732.5" y="50">10</text>
  </g>

  <!-- grid -->
  <g stroke="#D7DDD9" stroke-width="1">
    <line x1="210" y1="58" x2="210" y2="262"/><line x1="265" y1="58" x2="265" y2="262"/>
    <line x1="320" y1="58" x2="320" y2="262"/><line x1="375" y1="58" x2="375" y2="262"/>
    <line x1="430" y1="58" x2="430" y2="262"/><line x1="485" y1="58" x2="485" y2="262"/>
    <line x1="540" y1="58" x2="540" y2="262"/><line x1="595" y1="58" x2="595" y2="262"/>
    <line x1="650" y1="58" x2="650" y2="262"/><line x1="705" y1="58" x2="705" y2="262"/>
    <line x1="760" y1="58" x2="760" y2="262"/>
    <line x1="210" y1="58" x2="760" y2="58"/><line x1="210" y1="92" x2="760" y2="92"/>
    <line x1="210" y1="126" x2="760" y2="126"/><line x1="210" y1="160" x2="760" y2="160"/>
    <line x1="210" y1="194" x2="760" y2="194"/><line x1="210" y1="228" x2="760" y2="228"/>
    <line x1="210" y1="262" x2="760" y2="262"/>
  </g>

  <!-- task labels -->
  <g font-size="13" fill="#1F2937" text-anchor="end">
    <text x="200" y="80">Analysis</text>
    <text x="200" y="114">Database design</text>
    <text x="200" y="148">UI design</text>
    <text x="200" y="182">Coding</text>
    <text x="200" y="216">Testing</text>
    <text x="200" y="250">Evaluation</text>
  </g>

  <!-- bars -->
  <g fill="#1B6B45">
    <rect x="210" y="63" width="110" height="24" rx="3"/>
    <rect x="320" y="97" width="110" height="24" rx="3"/>
    <rect x="320" y="131" width="110" height="24" rx="3"/>
    <rect x="430" y="165" width="220" height="24" rx="3"/>
    <rect x="540" y="199" width="165" height="24" rx="3"/>
    <rect x="705" y="233" width="55" height="24" rx="3"/>
  </g>

  <text x="485" y="288" text-anchor="middle" font-size="12" fill="#555" font-style="italic">The two design tasks run at the same time; testing begins before coding has finished.</text>
</svg>
