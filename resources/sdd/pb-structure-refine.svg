<svg viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Refinement structure diagram for step 3, the insertion sort">
  <defs>
    <marker id="loopArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#92750A"/>
    </marker>
  </defs>
  <rect width="1080" height="700" fill="#ffffff"/>
  <text x="540" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#002D1C">Refinement of step 3 — insertion sort on an array of records</text>

  <!-- step 3 -->
  <rect x="390" y="44" width="300" height="58" fill="#ffffff" stroke="#1F2937" stroke-width="2"/>
  <text x="540" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">3. Sort results by date,</text>
  <text x="540" y="88" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F2937">most recent first</text>

  <line x1="540" y1="102" x2="540" y2="136" stroke="#1F2937" stroke-width="2"/>

  <!-- 3.1 fixed loop -->
  <rect x="330" y="136" width="420" height="62" fill="#FEF9E7" stroke="#1F2937" stroke-width="2"/>
  <path d="M 344 152 a 11 11 0 1 0 11 -11" fill="none" stroke="#92750A" stroke-width="2.2" marker-end="url(#loopArr)"/>
  <text x="556" y="162" text-anchor="middle" font-size="13.5" fill="#1F2937">3.1 For each record from the second</text>
  <text x="556" y="182" text-anchor="middle" font-size="13.5" fill="#1F2937">to the last (fixed loop)</text>

  <!-- connectors to children -->
  <g stroke="#1F2937" stroke-width="2" fill="none">
    <line x1="540" y1="198" x2="540" y2="232"/>
    <line x1="140" y1="232" x2="940" y2="232"/>
    <line x1="140" y1="232" x2="140" y2="272"/>
    <line x1="405" y1="232" x2="405" y2="272"/>
    <line x1="670" y1="232" x2="670" y2="272"/>
    <line x1="940" y1="232" x2="940" y2="272"/>
  </g>

  <!-- children of 3.1 -->
  <rect x="30" y="272" width="220" height="78" fill="#ffffff" stroke="#1F2937" stroke-width="2"/>
  <text x="140" y="300" text-anchor="middle" font-size="13" fill="#1F2937">3.2 Copy the current</text>
  <text x="140" y="318" text-anchor="middle" font-size="13" fill="#1F2937">record into temp</text>

  <rect x="295" y="272" width="220" height="78" fill="#ffffff" stroke="#1F2937" stroke-width="2"/>
  <text x="405" y="300" text-anchor="middle" font-size="13" fill="#1F2937">3.3 Set pointer to the</text>
  <text x="405" y="318" text-anchor="middle" font-size="13" fill="#1F2937">position before it</text>

  <rect x="560" y="272" width="220" height="78" fill="#FEF9E7" stroke="#1F2937" stroke-width="2"/>
  <path d="M 574 290 a 10 10 0 1 0 10 -10" fill="none" stroke="#92750A" stroke-width="2.2" marker-end="url(#loopArr)"/>
  <text x="682" y="298" text-anchor="middle" font-size="12.5" fill="#1F2937">3.4 While pointer &#8805; 0 and</text>
  <text x="682" y="315" text-anchor="middle" font-size="12.5" fill="#1F2937">temp is more recent than</text>
  <text x="682" y="332" text-anchor="middle" font-size="12.5" fill="#1F2937">resultsArray[pointer]</text>

  <rect x="830" y="272" width="220" height="78" fill="#ffffff" stroke="#1F2937" stroke-width="2"/>
  <text x="940" y="300" text-anchor="middle" font-size="13" fill="#1F2937">3.7 Place temp at</text>
  <text x="940" y="318" text-anchor="middle" font-size="13" fill="#1F2937">position pointer + 1</text>

  <!-- children of 3.4 -->
  <g stroke="#1F2937" stroke-width="2" fill="none">
    <line x1="670" y1="350" x2="670" y2="392"/>
    <line x1="580" y1="392" x2="790" y2="392"/>
    <line x1="580" y1="392" x2="580" y2="432"/>
    <line x1="790" y1="392" x2="790" y2="432"/>
  </g>

  <rect x="472" y="432" width="216" height="78" fill="#ffffff" stroke="#1F2937" stroke-width="2"/>
  <text x="580" y="460" text-anchor="middle" font-size="13" fill="#1F2937">3.5 Move that record</text>
  <text x="580" y="478" text-anchor="middle" font-size="13" fill="#1F2937">up one position</text>

  <rect x="682" y="432" width="216" height="78" fill="#ffffff" stroke="#1F2937" stroke-width="2"/>
  <text x="790" y="460" text-anchor="middle" font-size="13" fill="#1F2937">3.6 Subtract 1 from</text>
  <text x="790" y="478" text-anchor="middle" font-size="13" fill="#1F2937">pointer</text>

  <!-- notes -->
  <rect x="30" y="548" width="1020" height="128" fill="#F7F9F8" stroke="#D7DDD9"/>
  <text x="48" y="574" font-size="13" font-weight="700" fill="#002D1C">Reading the diagram</text>
  <text x="48" y="598" font-size="12.5" fill="#1F2937">The gold boxes with the loop symbol are <tspan font-weight="700">iteration</tspan>. 3.1 is a fixed loop — the number of records is known, so it runs a set number of times.</text>
  <text x="48" y="620" font-size="12.5" fill="#1F2937">3.4 is a conditional loop nested inside it — it keeps shifting records up until the right gap is found, so nobody knows in advance how many</text>
  <text x="48" y="642" font-size="12.5" fill="#1F2937">times it will run. Everything below a box happens <tspan font-weight="700">inside</tspan> it; boxes at the same level run <tspan font-weight="700">left to right</tspan>. Steps 3.2, 3.3, 3.4 and 3.7 all</text>
  <text x="48" y="664" font-size="12.5" fill="#1F2937">sit inside 3.1, so all four happen once for every record the outer loop reaches.</text>
</svg>
