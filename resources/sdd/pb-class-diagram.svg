<svg viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="UML class diagram with Person, Athlete and Result classes">
  <defs>
    <marker id="inhArr" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1F2937"/>
    </marker>
    <marker id="arrObj" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#92750A"/>
    </marker>
  </defs>
  <rect width="1080" height="700" fill="#ffffff"/>
  <text x="540" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#002D1C">PB Tracker — UML class diagram</text>

  <!-- Person (super-class) -->
  <g>
    <rect x="390" y="52" width="290" height="184" fill="#ffffff" stroke="#1F2937" stroke-width="2"/>
    <rect x="390" y="52" width="290" height="34" fill="#00442A"/>
    <text x="535" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Person</text>
    <line x1="390" y1="150" x2="680" y2="150" stroke="#1F2937" stroke-width="1.5"/>
    <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1F2937">
      <text x="404" y="106">&#8722;firstName: String</text>
      <text x="404" y="124">&#8722;surname: String</text>
      <text x="404" y="142">&#8722;dateOfBirth: String</text>
      <text x="404" y="170">+Person()</text>
      <text x="404" y="188">+getName()</text>
      <text x="404" y="206">+getAge()</text>
      <text x="404" y="224">+setSurname()</text>
    </g>
  </g>
  <text x="700" y="98" font-size="12" font-style="italic" fill="#1B6B45">super-class</text>
  <text x="700" y="114" font-size="11.5" fill="#555">the shared data every</text>
  <text x="700" y="129" font-size="11.5" fill="#555">person has, defined once</text>

  <!-- inheritance arrow: Athlete up to Person -->
  <line x1="330" y1="300" x2="440" y2="240" stroke="#1F2937" stroke-width="2" marker-end="url(#inhArr)"/>
  <text x="196" y="272" font-size="12" font-style="italic" fill="#1F2937">inheritance — arrow points</text>
  <text x="196" y="287" font-size="12" font-style="italic" fill="#1F2937">at the super-class</text>

  <!-- Athlete (sub-class) -->
  <g>
    <rect x="60" y="308" width="330" height="230" fill="#ffffff" stroke="#1F2937" stroke-width="2"/>
    <rect x="60" y="308" width="330" height="34" fill="#1B6B45"/>
    <text x="225" y="331" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Athlete</text>
    <line x1="60" y1="424" x2="390" y2="424" stroke="#1F2937" stroke-width="1.5"/>
    <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1F2937">
      <text x="74" y="362">&#8722;membershipNo: Integer</text>
      <text x="74" y="380">&#8722;numResults: Integer</text>
      <text x="74" y="398" fill="#92750A" font-weight="700">&#8722;results: Array of Result[ ]</text>
      <text x="74" y="416">&#8722;club: String</text>
      <text x="74" y="444">+Athlete()</text>
      <text x="74" y="462">+addResult()</text>
      <text x="74" y="480">+getPersonalBest()</text>
      <text x="74" y="498">+sortByDate()</text>
      <text x="74" y="516">+getResultCount()</text>
    </g>
  </g>
  <text x="60" y="562" font-size="12" font-style="italic" fill="#1B6B45">sub-class — an Athlete object also has</text>
  <text x="60" y="578" font-size="12" font-style="italic" fill="#1B6B45">firstName, surname and dateOfBirth</text>

  <!-- array of objects arrow: Athlete to Result -->
  <line x1="396" y1="398" x2="700" y2="398" stroke="#92750A" stroke-width="2" marker-end="url(#arrObj)"/>
  <text x="452" y="388" font-size="12" font-style="italic" fill="#92750A">array of objects</text>

  <!-- Result -->
  <g>
    <rect x="706" y="308" width="300" height="212" fill="#ffffff" stroke="#1F2937" stroke-width="2"/>
    <rect x="706" y="308" width="300" height="34" fill="#1B6B45"/>
    <text x="856" y="331" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Result</text>
    <line x1="706" y1="406" x2="1006" y2="406" stroke="#1F2937" stroke-width="1.5"/>
    <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1F2937">
      <text x="720" y="362">&#8722;date: String</text>
      <text x="720" y="380">&#8722;event: String</text>
      <text x="720" y="398">&#8722;time: Real</text>
      <text x="720" y="426">+Result()</text>
      <text x="720" y="444">+getTime()</text>
      <text x="720" y="462">+getDate()</text>
      <text x="720" y="480">+getEvent()</text>
      <text x="720" y="498">+setTime()</text>
    </g>
  </g>
  <text x="706" y="544" font-size="12" font-style="italic" fill="#555">one race result — many of these</text>
  <text x="706" y="560" font-size="12" font-style="italic" fill="#555">belong to each Athlete</text>

  <!-- reading notes -->
  <rect x="60" y="600" width="946" height="82" fill="#F7F9F8" stroke="#D7DDD9"/>
  <text x="78" y="624" font-size="13" font-weight="700" fill="#002D1C">Three classes, two relationships</text>
  <text x="78" y="646" font-size="12.5" fill="#1F2937">Athlete <tspan font-weight="700">inherits</tspan> from Person, so an Athlete object has seven instance variables — its own four plus Person's three — without them being re-declared.</text>
  <text x="78" y="668" font-size="12.5" fill="#1F2937">Athlete also holds an <tspan font-weight="700">array of objects</tspan>, so a second arrow runs from that instance variable to the Result class it stores.</text>
</svg>
