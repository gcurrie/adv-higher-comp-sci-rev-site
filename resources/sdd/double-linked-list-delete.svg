<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 672" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Deleting a node from the middle of a double linked list</title>
  <desc id="d">The same double linked list shown before and after the node at address 318, holding harbour.jpg, is deleted. In the before version the four nodes are linked in both directions: 601 beach.jpg, 745 sunset.jpg, 318 harbour.jpg and 522 castle.jpg. In the after version node 318 is greyed out and crossed through, labelled removed, memory freed. The next pointer of node 745 is highlighted in gold and now holds 522 instead of 318, with a gold arrow arcing over the removed node to node 522. The previous pointer of node 522 is highlighted in gold and now holds 745 instead of 318, with a gold arrow running back beneath the removed node to node 745. A note explains that the next pointer of node 745 changed from 318 to 522 so the list skips the deleted node going forwards, that the previous pointer of node 522 changed from 318 to 745 so it also skips it going backwards, and that node 318 is then freed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00442A"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/>
    </marker>
    <marker id="lead" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>
