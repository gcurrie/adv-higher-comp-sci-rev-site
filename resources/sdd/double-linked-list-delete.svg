  <text x="156" y="582" font-size="14.5" fill="#92750A" text-anchor="start" font-weight="800">Two pointers change &#8212; and no data is moved</text>
  <text x="156" y="607" font-size="14" fill="#1A1A1A" text-anchor="start">1. The <tspan font-weight="700">next</tspan> pointer of node <tspan font-weight="700">745</tspan> changes from 318 to <tspan font-weight="700">522</tspan>, so the list skips over the deleted node going forwards.</text>
