  <text x="974.0" y="195" font-size="16" fill="#00442A" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace">522</text>
  <rect x="874" y="206" width="50" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="899.0" y="233" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace">318</text>
  <rect x="924" y="206" width="100" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="974.0" y="233" font-size="14.5" fill="#1A1A1A" text-anchor="middle">castle.jpg</text>
  <rect x="1024" y="206" width="50" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
