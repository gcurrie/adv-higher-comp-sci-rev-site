<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 432" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A double linked list — a photo gallery viewer</title>
  <desc id="d">Four nodes drawn left to right, each with a memory address across the top and three cells beneath it: a previous pointer, a data item and a next pointer. Node 601 holds beach.jpg with a previous pointer of Null and a next pointer of 745. Node 745 holds sunset.jpg with previous 601 and next 318. Node 318 holds harbour.jpg with previous 745 and next 522. Node 522 holds castle.jpg with previous 318 and a next pointer of Null. Head points to node 601. Arrows above the row run forwards from each next pointer to the following node, and arrows below the row run backwards from each previous pointer to the preceding node, labelled forwards and backwards. A caption explains that every node stores two pointers, the address of the next node and the address of the previous one, and that the first node's previous pointer and the last node's next pointer are both Null.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00442A"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/>
    </marker>
    <marker id="lead" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>
  <rect width="1180" height="432" fill="#FFFFFF"/>
  <text x="590" y="42" font-size="25" fill="#00442A" text-anchor="middle" font-weight="800">gallery — a double linked list</text>
  <text x="590" y="70" font-size="15" fill="#4A5568" text-anchor="middle">photographs in a gallery viewer &#183; the user can move forwards <tspan font-weight="700">and</tspan> backwards through them</text>
  <text x="155.0" y="100" font-size="12.5" fill="#4A5568" text-anchor="middle" font-weight="700">previous pointer</text>
  <path d="M155.0,106 L155.0,166" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#lead)"/>
  <text x="230.0" y="130" font-size="12.5" fill="#4A5568" text-anchor="middle" font-weight="700">data item</text>
  <path d="M230.0,136 L230.0,166" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#lead)"/>
  <text x="305.0" y="100" font-size="12.5" fill="#4A5568" text-anchor="middle" font-weight="700">next pointer</text>
  <path d="M305.0,106 L305.0,166" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#lead)"/>
  <text x="38" y="194" font-size="16" fill="#00442A" text-anchor="middle" font-weight="800">Head</text>
  <path d="M72,188.0 L126,188.0" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="130" y="170" width="200" height="36" fill="#E8F5EE" stroke="#00442A" stroke-width="1.6"/>
  <text x="230.0" y="195" font-size="16" fill="#00442A" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace">601</text>
  <rect x="130" y="206" width="50" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="155.0" y="233" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace">Null</text>
  <rect x="180" y="206" width="100" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="230.0" y="233" font-size="14.5" fill="#1A1A1A" text-anchor="middle">beach.jpg</text>
  <rect x="280" y="206" width="50" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="305.0" y="233" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace">745</text>
