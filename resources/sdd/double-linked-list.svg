  <path d="M330,227.0 L350,227.0 L350,188.0 L374,188.0" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M578,227.0 L598,227.0 L598,188.0 L622,188.0" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M826,227.0 L846,227.0 L846,188.0 L870,188.0" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M403.0,248 L403.0,288 L230.0,288 L230.0,252" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M651.0,248 L651.0,288 L478.0,288 L478.0,252" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M899.0,248 L899.0,288 L726.0,288 L726.0,252" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="590" y="156" font-size="12.5" fill="#00442A" text-anchor="middle" font-weight="800">&#9654;&#9654;  forwards  &#9654;&#9654;</text>
  <text x="590" y="310" font-size="12.5" fill="#00442A" text-anchor="middle" font-weight="800">&#9664;&#9664;  backwards  &#9664;&#9664;</text>
  <text x="590" y="380" font-size="14.5" fill="#4A5568" text-anchor="middle">Every node stores <tspan font-weight="700">two</tspan> pointers &#8212; the address of the <tspan font-weight="700">next</tspan> node and the address of the <tspan font-weight="700">previous</tspan> one.</text>
  <text x="590" y="402" font-size="14.5" fill="#4A5568" text-anchor="middle">The first node&#8217;s previous pointer and the last node&#8217;s next pointer are both <tspan font-weight="800" fill="#92750A">Null</tspan>.</text>
</svg>
