  <rect x="780" y="234" width="80" height="50" fill="#FEF3C7" stroke="#C9A227" stroke-width="2.6"/>
  <text x="820.0" y="266" font-size="16" fill="#92750A" text-anchor="middle" font-weight="800" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">68</text>
  <rect x="860" y="234" width="80" height="50" fill="#ffffff" stroke="#1B6B45" stroke-width="1.8"/>
  <text x="900.0" y="266" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">79</text>
