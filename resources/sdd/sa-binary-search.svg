  <text x="900.0" y="420" font-size="11.5" fill="#92750A" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">low/mid</text>
  <text x="980.0" y="420" font-size="11.5" fill="#1B6B45" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">high</text>
  <text x="140" y="444" font-size="13.5" fill="#1A1A1A">mid holds 79. Found, after 3 comparisons.</text>
  <rect x="140" y="470" width="900" height="46" fill="#E8F5EE" stroke="#1B6B45" stroke-width="1.6"/>
  <text x="160" y="498" font-size="13.5" fill="#00442A">A linear search would have checked 10 elements to reach 79. Binary search needed 3 &#8212; but only because the array was already sorted.</text>
