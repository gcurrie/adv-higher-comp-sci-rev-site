  <rect x="220" y="234" width="80" height="50" fill="#F8F7F2" stroke="#D1D5DB" stroke-width="1.4"/>
  <text x="260.0" y="266" font-size="16" fill="#B6BCC6" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">8</text>
  <rect x="300" y="234" width="80" height="50" fill="#F8F7F2" stroke="#D1D5DB" stroke-width="1.4"/>
