  <text x="180.0" y="184" font-size="11.5" fill="#1B6B45" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">low</text>
  <text x="580.0" y="184" font-size="11.5" fill="#92750A" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">mid</text>
  <text x="980.0" y="184" font-size="11.5" fill="#1B6B45" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">high</text>
  <text x="140" y="208" font-size="13.5" fill="#1A1A1A">mid holds 31. 79 &gt; 31, so the target must be in the upper half &#8212; discard everything up to mid and set low = 6.</text>
  <text x="60" y="264" font-size="12" fill="#4A5568" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">pass 2</text>
  <rect x="140" y="234" width="80" height="50" fill="#F8F7F2" stroke="#D1D5DB" stroke-width="1.4"/>
