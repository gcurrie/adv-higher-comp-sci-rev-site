  <rect x="620" y="234" width="80" height="50" fill="#ffffff" stroke="#1B6B45" stroke-width="1.8"/>
  <text x="660.0" y="266" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">44</text>
