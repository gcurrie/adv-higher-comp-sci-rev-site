<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a binary search narrows a sorted array</title>
  <desc id="d">A sorted array of eleven values: 3, 8, 12, 17, 23, 31, 44, 56, 68, 79 and 91, with indices 0 to 10, searched for the value 79. Pass 1 has low at index 0 and high at index 10, giving mid at index 5 which holds 31; because 79 is greater than 31 the lower half is discarded and low becomes 6. Pass 2 has low at 6 and high at 10, giving mid at index 8 which holds 68; because 79 is greater than 68 low becomes 9. Pass 3 has low at 9 and high at 10, giving mid at index 9 which holds 79, so the target is found after three comparisons. Discarded elements are greyed out at each pass and the mid element is highlighted in gold. A note explains that a linear search would have checked ten elements to reach 79, while binary search needed three, but only because the array was already sorted.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#92750A"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E40AF"/>
    </marker>
    <marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B6B45"/>
    </marker>
  </defs>
  <rect width="1140" height="540" fill="#ffffff"/>
  <text x="570" y="36" font-size="20" fill="#00442A" text-anchor="middle" font-weight="800">Binary search &#8212; each comparison halves what is left</text>
  <text x="570" y="62" font-size="14" fill="#4A5568" text-anchor="middle">Searching a <tspan font-weight='700'>sorted</tspan> array of 11 values for <tspan font-weight='700' fill='#92750A'>79</tspan> &#8212; found in 3 comparisons, not 10.</text>
