  <text x="980.0" y="266" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">91</text>
  <text x="660.0" y="302" font-size="11.5" fill="#1B6B45" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">low</text>
  <text x="820.0" y="302" font-size="11.5" fill="#92750A" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">mid</text>
  <text x="980.0" y="302" font-size="11.5" fill="#1B6B45" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,Consolas,Menlo,monospace">high</text>
  <text x="140" y="326" font-size="13.5" fill="#1A1A1A">mid holds 68. 79 &gt; 68, so discard again and set low = 9.</text>
