<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 230" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A single linked list of delivery orders waiting to be collected</title>
  <desc id="d">Four nodes drawn left to right under the heading collectionQueue, orders waiting to be collected. Each node shows a memory address across the top and a data item and pointer beneath. Head points to the first node. Node 314 holds Order 4471 and points to 208. Node 208 holds Order 4472 and points to 476. Node 476 holds Order 4473 and points to 129. Node 129 holds Order 4474 and its pointer leads to Null.</desc>
