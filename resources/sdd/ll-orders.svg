    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00442A"/>
    </marker>
  </defs>
  <rect width="1180" height="230" fill="#FFFFFF"/>
  <text x="590" y="40" font-size="19" fill="#00442A" text-anchor="middle" font-weight="800">collectionQueue &#8212; orders waiting to be collected</text>
  <text x="98" y="114" font-size="16" fill="#00442A" text-anchor="middle" font-weight="800">Head</text>
