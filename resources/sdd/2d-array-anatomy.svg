<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="tdaTitle tdaDesc">
  <title id="tdaTitle">Anatomy of a 2D Array — a cinema seating plan</title>
  <desc id="tdaDesc">A grid of 5 rows by 8 columns representing the array seatPlan, which stores a cinema seating plan as strings. Column indices 0 to 7 run across the top and row indices 0 to 4 run down the left side. A bracket above the grid labels the column index as which seat along the row, and a bracket to the left labels the row index as which row of the cinema. Seven cells are shaded green and contain the word Booked, and the remaining cells are white and empty. The cell in row 2, column 5 is highlighted in gold and contains Booked; the row label 2 and the column label 5 are also highlighted in gold to show how the two indices select it. A legend explains that green cells hold the string Booked, white cells hold an empty string, and the gold cell is the element being referenced. A panel underneath shows the reference seatPlan square bracket 2 square bracket square bracket 5 square bracket, explains that this means row 2, the third row, and column 5, the sixth seat, giving the value Booked, and warns that row comes first and then column, because swapping the two indices is the classic exam error.</desc>

  <defs>
    <marker id="tdaArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>

  <rect width="1180" height="600" fill="#FFFFFF"/>

  <text x="590" y="42" text-anchor="middle" font-size="25" font-weight="800" fill="#00442A">seatPlan — a 2D array of STRING</text>
  <text x="590" y="70" text-anchor="middle" font-size="15" fill="#4A5568">5 rows &#215; 8 columns &#183; every element holds the same data type</text>

  <!-- column bracket -->
  <text x="640" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B6B45">column index — which seat along the row</text>
  <path d="M260,126 L260,118 L1020,118 L1020,126" fill="none" stroke="#1B6B45" stroke-width="2"/>

  <!-- row bracket -->
  <text transform="rotate(-90 60 280)" x="60" y="280" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B6B45">row index — which row of the cinema</text>
  <path d="M206,150 L198,150 L198,410 L206,410" fill="none" stroke="#1B6B45" stroke-width="2"/>

  <!-- column headers -->
  <text x="307"  y="140" text-anchor="middle" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[0]</text>
  <text x="402"  y="140" text-anchor="middle" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[1]</text>
  <text x="497"  y="140" text-anchor="middle" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[2]</text>
  <text x="592"  y="140" text-anchor="middle" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[3]</text>
  <text x="687"  y="140" text-anchor="middle" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[4]</text>
  <text x="782"  y="140" text-anchor="middle" font-size="15" font-weight="800" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#92750A">[5]</text>
  <text x="877"  y="140" text-anchor="middle" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[6]</text>
  <text x="972"  y="140" text-anchor="middle" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[7]</text>

  <!-- row headers -->
  <text x="245" y="183" text-anchor="end" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[0]</text>
  <text x="245" y="235" text-anchor="end" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[1]</text>
  <text x="245" y="287" text-anchor="end" font-size="15" font-weight="800" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#92750A">[2]</text>
  <text x="245" y="339" text-anchor="end" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[3]</text>
  <text x="245" y="391" text-anchor="end" font-size="15" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4A5568">[4]</text>

  <!-- row 0 -->
  <rect x="260" y="150" width="95" height="52" fill="#E8F5EE" stroke="#D1D5DB"/><text x="307" y="182" text-anchor="middle" font-size="13" fill="#00442A">Booked</text>
  <rect x="355" y="150" width="95" height="52" fill="#E8F5EE" stroke="#D1D5DB"/><text x="402" y="182" text-anchor="middle" font-size="13" fill="#00442A">Booked</text>
  <rect x="450" y="150" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="545" y="150" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="640" y="150" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="735" y="150" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="830" y="150" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="925" y="150" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>

  <!-- row 1 -->
  <rect x="260" y="202" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="355" y="202" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="450" y="202" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="545" y="202" width="95" height="52" fill="#E8F5EE" stroke="#D1D5DB"/><text x="592" y="234" text-anchor="middle" font-size="13" fill="#00442A">Booked</text>
  <rect x="640" y="202" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="735" y="202" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="830" y="202" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="925" y="202" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>

  <!-- row 2 -->
  <rect x="260" y="254" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="355" y="254" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="450" y="254" width="95" height="52" fill="#E8F5EE" stroke="#D1D5DB"/><text x="497" y="286" text-anchor="middle" font-size="13" fill="#00442A">Booked</text>
  <rect x="545" y="254" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="640" y="254" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="735" y="254" width="95" height="52" fill="#FEF3C7" stroke="#C9A227" stroke-width="3"/><text x="782" y="286" text-anchor="middle" font-size="13.5" font-weight="800" fill="#92750A">Booked</text>
  <rect x="830" y="254" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="925" y="254" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>

  <!-- row 3 -->
  <rect x="260" y="306" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="355" y="306" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="450" y="306" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="545" y="306" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="640" y="306" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="735" y="306" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="830" y="306" width="95" height="52" fill="#E8F5EE" stroke="#D1D5DB"/><text x="877" y="338" text-anchor="middle" font-size="13" fill="#00442A">Booked</text>
  <rect x="925" y="306" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>

  <!-- row 4 -->
  <rect x="260" y="358" width="95" height="52" fill="#E8F5EE" stroke="#D1D5DB"/><text x="307" y="390" text-anchor="middle" font-size="13" fill="#00442A">Booked</text>
  <rect x="355" y="358" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="450" y="358" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="545" y="358" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="640" y="358" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="735" y="358" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="830" y="358" width="95" height="52" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="925" y="358" width="95" height="52" fill="#E8F5EE" stroke="#D1D5DB"/><text x="972" y="390" text-anchor="middle" font-size="13" fill="#00442A">Booked</text>

  <!-- legend -->
  <rect x="260" y="430" width="16" height="16" fill="#E8F5EE" stroke="#D1D5DB"/>
  <text x="284" y="443" font-size="13" fill="#4A5568">"Booked"</text>
  <rect x="392" y="430" width="16" height="16" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="416" y="443" font-size="13" fill="#4A5568">"" — an empty seat</text>
  <rect x="580" y="430" width="16" height="16" fill="#FEF3C7" stroke="#C9A227" stroke-width="2"/>
  <text x="604" y="443" font-size="13" fill="#4A5568">the element being referenced below</text>

  <!-- callout -->
  <rect x="260" y="470" width="760" height="110" fill="#F8F7F2" stroke="#D1D5DB"/>
  <text x="290" y="507" font-size="23" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#92750A">seatPlan[2][5]</text>
  <text x="290" y="536" font-size="15" fill="#1A1A1A">row <tspan font-weight="700">2</tspan> (the third row), column <tspan font-weight="700">5</tspan> (the sixth seat) &#8594; <tspan font-weight="700">"Booked"</tspan></text>
  <text x="290" y="562" font-size="13.5" font-style="italic" fill="#4A5568">Row first, then column. Swapping the two indices is the classic exam error.</text>
</svg>
