<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 250" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A double linked list holding the slides of a presentation</title>
  <desc id="d">Four nodes drawn left to right under the heading slideDeck, a presentation the user can step through. Each node has a memory address across the top and three cells beneath: a previous pointer, a data item and a next pointer. Head points to the first node. Node 702 holds Slide 1 with previous Null and next 855. Node 855 holds Slide 2 with previous 702 and next 419. Node 419 holds Slide 3 with previous 855 and next 260. Node 260 holds Slide 4 with previous 419 and next Null. Arrows above the row run forwards between the nodes and arrows below the row run backwards.</desc>
