  <text x="58" y="144.0" font-size="16" fill="#00442A" text-anchor="middle" font-weight="800">Head</text>
  <path d="M92,138.0 L146,138.0" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="150" y="120" width="150" height="36" fill="#E8F5EE" stroke="#00442A" stroke-width="1.6"/>
  <text x="225.0" y="145" font-size="16" fill="#00442A" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace">412</text>
