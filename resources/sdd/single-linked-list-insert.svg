<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Adding a node to the end of a single linked list</title>
  <desc id="d">Two versions of the same single linked list, before and after a new request is added. The before list has four nodes: address 412 holding Anthem pointing to 268, address 268 holding Skyfall pointing to 531, address 531 holding Yellow pointing to 187, and address 187 holding Titanium with a pointer of Null. Head points to node 412. The after list has five nodes. The first three are unchanged. Node 187, holding Titanium, now has its pointer highlighted in gold and holding 356 instead of Null, and a gold arrow runs from it to a new gold-outlined node at address 356 holding Vertigo, whose pointer is Null. A note explains that a new node was created at address 356 holding Vertigo with its pointer set to Null, and that the pointer of node 187 changed from Null to 356, with nothing else moving.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00442A"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/>
    </marker>
    <marker id="lead" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>
  <rect width="1180" height="600" fill="#FFFFFF"/>
  <text x="590" y="40" font-size="25" fill="#00442A" text-anchor="middle" font-weight="800">Adding a request to the queue</text>
  <text x="590" y="68" font-size="14.5" fill="#4A5568" text-anchor="middle">A listener requests &#8220;Vertigo&#8221;. It is stored at memory address 356 and joins the end of the queue.</text>
