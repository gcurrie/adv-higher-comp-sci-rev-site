  <text x="202.0" y="183" font-size="14.5" fill="#1A1A1A" text-anchor="middle">Anthem</text>
  <rect x="254" y="156" width="46" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="277.0" y="183" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace">268</text>
  <path d="M300,177.0 L318,177.0 L318,138.0 L338,138.0" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="342" y="120" width="150" height="36" fill="#E8F5EE" stroke="#00442A" stroke-width="1.6"/>
  <text x="417.0" y="145" font-size="16" fill="#00442A" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace">268</text>
  <rect x="342" y="156" width="104" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="394.0" y="183" font-size="14.5" fill="#1A1A1A" text-anchor="middle">Skyfall</text>
  <rect x="446" y="156" width="46" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="469.0" y="183" font-size="13.5" fill="#1A1A1A" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace">531</text>
  <path d="M492,177.0 L510,177.0 L510,138.0 L530,138.0" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="534" y="120" width="150" height="36" fill="#E8F5EE" stroke="#00442A" stroke-width="1.6"/>
  <text x="609.0" y="145" font-size="16" fill="#00442A" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace">531</text>
