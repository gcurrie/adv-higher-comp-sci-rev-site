<svg viewBox="0 0 1160 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Annotated GUI wireframe for the PB Tracker lookup screen">
  <defs>
    <marker id="ann" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
  </defs>
  <rect width="1160" height="700" fill="#ffffff"/>
  <text x="580" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#002D1C">PB Tracker — annotated GUI wireframe</text>

  <!-- window -->
  <rect x="290" y="52" width="520" height="470" fill="#FDFDFC" stroke="#1F2937" stroke-width="2"/>
  <rect x="290" y="52" width="520" height="36" fill="#00442A"/>
  <text x="308" y="76" font-size="14" font-weight="700" fill="#ffffff">Westbrae Harriers — PB Tracker</text>

  <!-- input: name -->
  <text x="312" y="118" font-size="13.5" font-weight="600" fill="#1F2937">Athlete name</text>
  <rect x="312" y="126" width="300" height="32" fill="#ffffff" stroke="#9AA3A0"/>
  <text x="322" y="147" font-size="13" fill="#8A9199">e.g. Ellie Morrison</text>

  <!-- input: distance -->
  <text x="312" y="184" font-size="13.5" font-weight="600" fill="#1F2937">Distance</text>
  <rect x="312" y="192" width="220" height="32" fill="#ffffff" stroke="#9AA3A0"/>
  <text x="322" y="213" font-size="13" fill="#1F2937">1500 m</text>
  <path d="M 508 203 l 8 8 l 8 -8" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- button -->
  <rect x="312" y="248" width="140" height="38" fill="#C9A227" stroke="#92750A" stroke-width="1.5"/>
  <text x="382" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#002D1C">Look Up</text>

  <!-- output area -->
  <line x1="312" y1="306" x2="788" y2="306" stroke="#D7DDD9" stroke-width="1.5"/>
  <text x="312" y="332" font-size="13.5" font-weight="700" fill="#002D1C">Personal best</text>
  <rect x="312" y="342" width="476" height="40" fill="#E8F5EE" stroke="#C7DED2"/>
  <text x="324" y="367" font-size="14" font-weight="700" fill="#00442A">4:21.6 &#8212; Scottish Schools, 12 May 2025</text>

  <text x="312" y="410" font-size="13.5" font-weight="700" fill="#002D1C">Three most recent</text>
  <rect x="312" y="420" width="476" height="82" fill="#ffffff" stroke="#D7DDD9"/>
  <g font-size="12.5" fill="#1F2937" font-family="Consolas, Menlo, monospace">
    <text x="324" y="441">18 Jun 2025   District League      4:24.9</text>
    <text x="324" y="463">12 May 2025   Scottish Schools    4:21.6</text>
    <text x="324" y="485">03 Apr 2025   Club Championship   4:27.2</text>
  </g>

  <!-- annotations -->
  <g stroke="#B91C1C" stroke-width="1.4" fill="none">
    <line x1="286" y1="142" x2="200" y2="142" marker-end="url(#ann)"/>
    <line x1="286" y1="208" x2="200" y2="208" marker-end="url(#ann)"/>
    <line x1="286" y1="267" x2="200" y2="267" marker-end="url(#ann)"/>
    <line x1="814" y1="362" x2="900" y2="362" marker-end="url(#ann)"/>
    <line x1="814" y1="460" x2="900" y2="460" marker-end="url(#ann)"/>
    <line x1="550" y1="48" x2="550" y2="600" stroke="none"/>
  </g>

  <!-- left annotation cards -->
  <g>
    <rect x="14" y="104" width="182" height="76" fill="#FDECEA" stroke="#B91C1C"/>
    <text x="24" y="122" font-size="10" font-weight="700" fill="#B91C1C" letter-spacing="1">INPUT + VALIDATION</text>
    <text x="24" y="140" font-size="11.5" fill="#1F2937">athleteName, text box.</text>
    <text x="24" y="156" font-size="11.5" fill="#1F2937">Presence check — must</text>
    <text x="24" y="172" font-size="11.5" fill="#1F2937">not be left blank.</text>

    <rect x="14" y="188" width="182" height="76" fill="#FDECEA" stroke="#B91C1C"/>
    <text x="24" y="206" font-size="10" font-weight="700" fill="#B91C1C" letter-spacing="1">INPUT + VALIDATION</text>
    <text x="24" y="224" font-size="11.5" fill="#1F2937">distance, drop-down list.</text>
    <text x="24" y="240" font-size="11.5" fill="#1F2937">Restricted choice — only</text>
    <text x="24" y="256" font-size="11.5" fill="#1F2937">100 m to 10 000 m.</text>

    <rect x="14" y="228" width="0" height="0" fill="none"/>

    <rect x="14" y="276" width="182" height="106" fill="#FDECEA" stroke="#B91C1C"/>
    <text x="24" y="294" font-size="10" font-weight="700" fill="#B91C1C" letter-spacing="1">UNDERLYING PROCESS</text>
    <text x="24" y="312" font-size="11.5" fill="#1F2937">Clicking Look Up reads</text>
    <text x="24" y="328" font-size="11.5" fill="#1F2937">matching results from the</text>
    <text x="24" y="344" font-size="11.5" fill="#1F2937">database into resultsArray,</text>
    <text x="24" y="360" font-size="11.5" fill="#1F2937">insertion sorts them by date,</text>
    <text x="24" y="376" font-size="11.5" fill="#1F2937">then finds the fastest time.</text>
  </g>

  <!-- right annotation cards -->
  <g>
    <rect x="906" y="324" width="240" height="76" fill="#FDECEA" stroke="#B91C1C"/>
    <text x="916" y="342" font-size="10" font-weight="700" fill="#B91C1C" letter-spacing="1">OUTPUT</text>
    <text x="916" y="360" font-size="11.5" fill="#1F2937">Personal best — the fastest</text>
    <text x="916" y="376" font-size="11.5" fill="#1F2937">time in resultsArray, with its</text>
    <text x="916" y="392" font-size="11.5" fill="#1F2937">event and date.</text>

    <rect x="906" y="422" width="240" height="76" fill="#FDECEA" stroke="#B91C1C"/>
    <text x="916" y="440" font-size="10" font-weight="700" fill="#B91C1C" letter-spacing="1">OUTPUT</text>
    <text x="916" y="458" font-size="11.5" fill="#1F2937">The first three records of</text>
    <text x="916" y="474" font-size="11.5" fill="#1F2937">the sorted array — date,</text>
    <text x="916" y="490" font-size="11.5" fill="#1F2937">event and time, aligned.</text>
  </g>

  <!-- visual layout note -->
  <rect x="290" y="544" width="520" height="72" fill="#E8F5EE" stroke="#1B6B45"/>
  <text x="304" y="564" font-size="10" font-weight="700" fill="#1B6B45" letter-spacing="1">VISUAL LAYOUT</text>
  <text x="304" y="582" font-size="11.5" fill="#1F2937">Inputs grouped top-left in the order they are used, the action button directly</text>
  <text x="304" y="598" font-size="11.5" fill="#1F2937">beneath them, and outputs below a divider so results never overlap the controls.</text>

  <text x="580" y="648" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555">Every annotation names one of the five things an Advanced Higher wireframe must show.</text>
  <text x="580" y="670" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555">A wireframe is a design, not a screenshot — it is drawn before any code exists.</text>
</svg>
