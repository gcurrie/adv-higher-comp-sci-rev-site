<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" font-family="'Public Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="sllTitle sllDesc">
  <title id="sllTitle">A single linked list — a radio station request queue</title>
  <desc id="sllDesc">Four nodes drawn left to right, each made of three parts: a memory address across the top, and beneath it a data item and a pointer side by side. A label reading Head points with an arrow to the first node. The first node has address 412, data Anthem and pointer 268. The second has address 268, data Skyfall and pointer 531. The third has address 531, data Yellow and pointer 187. The fourth has address 187, data Titanium and a pointer holding Null. An arrow leaves each pointer and curves into the address of the next node, and the final pointer leads to the word Null. Small labels identify the three parts of a node as memory address, data item and pointer. A caption explains that Head holds the address of the first node, each pointer holds the address of the next node, and the final pointer is Null, which marks the end of the list.</desc>

  <defs>
    <marker id="sllArrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00442A"/>
    </marker>
    <marker id="sllLead" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>

  <rect width="1180" height="360" fill="#FFFFFF"/>

  <text x="590" y="42" text-anchor="middle" font-size="25" font-weight="800" fill="#00442A">requestQueue — a single linked list</text>
  <text x="590" y="70" text-anchor="middle" font-size="15" fill="#4A5568">song requests waiting to be played &#183; new requests join the end, played songs leave the front</text>

  <!-- part labels on node 1 -->
  <text x="249" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A5568">memory address</text>
  <path d="M249,118 L249,146" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#sllLead)"/>

  <!-- Head -->
  <text x="100" y="173" text-anchor="middle" font-size="16" font-weight="800" fill="#00442A">Head</text>
  <path d="M133,168 L186,168" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#sllArrow)"/>

  <!-- node 1 : 412 -->
  <rect x="190" y="150" width="170" height="36" fill="#E8F5EE" stroke="#00442A" stroke-width="1.6"/>
  <text x="275" y="175" text-anchor="middle" font-size="16" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#00442A">412</text>
  <rect x="190" y="186" width="118" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="249" y="213" text-anchor="middle" font-size="15" fill="#1A1A1A">Anthem</text>
  <rect x="308" y="186" width="52" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="334" y="213" text-anchor="middle" font-size="14" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#1A1A1A">268</text>

  <!-- node 2 : 268 -->
  <rect x="410" y="150" width="170" height="36" fill="#E8F5EE" stroke="#00442A" stroke-width="1.6"/>
  <text x="495" y="175" text-anchor="middle" font-size="16" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#00442A">268</text>
  <rect x="410" y="186" width="118" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="469" y="213" text-anchor="middle" font-size="15" fill="#1A1A1A">Skyfall</text>
  <rect x="528" y="186" width="52" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="554" y="213" text-anchor="middle" font-size="14" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#1A1A1A">531</text>

  <!-- node 3 : 531 -->
  <rect x="630" y="150" width="170" height="36" fill="#E8F5EE" stroke="#00442A" stroke-width="1.6"/>
  <text x="715" y="175" text-anchor="middle" font-size="16" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#00442A">531</text>
  <rect x="630" y="186" width="118" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="689" y="213" text-anchor="middle" font-size="15" fill="#1A1A1A">Yellow</text>
  <rect x="748" y="186" width="52" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="774" y="213" text-anchor="middle" font-size="14" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#1A1A1A">187</text>

  <!-- node 4 : 187 -->
  <rect x="850" y="150" width="170" height="36" fill="#E8F5EE" stroke="#00442A" stroke-width="1.6"/>
  <text x="935" y="175" text-anchor="middle" font-size="16" font-weight="700" font-family="'JetBrains Mono',ui-monospace,monospace" fill="#00442A">187</text>
  <rect x="850" y="186" width="118" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>
  <text x="909" y="213" text-anchor="middle" font-size="15" fill="#1A1A1A">Titanium</text>
  <rect x="968" y="186" width="52" height="42" fill="#FFFFFF" stroke="#00442A" stroke-width="1.6"/>

  <!-- pointer arrows -->
  <path d="M360,207 L385,207 L385,168 L406,168" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#sllArrow)"/>
  <path d="M580,207 L605,207 L605,168 L626,168" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#sllArrow)"/>
  <path d="M800,207 L825,207 L825,168 L846,168" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#sllArrow)"/>
  <path d="M1020,207 L1058,207" fill="none" stroke="#00442A" stroke-width="2.2" marker-end="url(#sllArrow)"/>
  <text x="1068" y="213" font-size="16" font-weight="800" fill="#92750A">Null</text>

  <!-- part labels below node 1 -->
  <path d="M249,262 L249,232" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#sllLead)"/>
  <text x="249" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A5568">data item</text>
  <path d="M334,262 L334,232" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#sllLead)"/>
  <text x="349" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A5568">pointer</text>

  <text x="590" y="336" text-anchor="middle" font-size="14.5" fill="#4A5568"><tspan font-weight="700" fill="#00442A">Head</tspan> holds the address of the first node &#183; each <tspan font-weight="700">pointer</tspan> holds the address of the <tspan font-weight="700">next</tspan> node &#183; the final pointer is <tspan font-weight="800" fill="#92750A">Null</tspan>, the end of the list</text>
</svg>
